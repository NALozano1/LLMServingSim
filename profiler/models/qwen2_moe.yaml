# Qwen2 MoE family — class catalog (Qwen1.5-MoE, Qwen2-57B-A14B, etc.).
#
# Covers ``Qwen2MoeForCausalLM`` checkpoints (``model_type: qwen2_moe``).
# MoE block is ``Qwen2MoeSparseMoeBlock`` (gate + routed experts + optional
# shared expert). ``num_experts`` / ``top_k`` come from HF config at boot.
#
# Canonical layer names mirror vLLM's attribute names (see
# ../vllm/vllm/model_executor/models/qwen2_moe.py).


sequence:
  prologue:  [embedding]
  pre_attn:  [layernorm, qkv_proj, rotary_emb, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: []
  mlp_moe:   [moe]
  head:      [final_layernorm, lm_head, sampler]


catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: Qwen2MoeDecoderLayer
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    rotary_emb:
      vllm: RotaryEmbedding
    o_proj:
      vllm: RowParallelLinear
      within: Qwen2MoeAttention
    final_layernorm:
      vllm: RMSNorm
      within: Qwen2MoeForCausalLM
      tp_stable: true
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  moe:
    moe:
      vllm: Qwen2MoeSparseMoeBlock
